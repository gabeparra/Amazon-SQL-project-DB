<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 500px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 12px 20px; background: #ff9900; border: none; font-weight: bold; cursor: pointer; }
        .back { margin-bottom: 15px; display: inline-block; color: #0066c0; }
        .success { background: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <a class="back" href="/">&larr; Back to Home</a>
    <h1>Add New Product</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="success">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
        <label>Seller</label>
        <select name="seller_id" required>
            {% for s in sellers %}
            <option value="{{ s.seller_id }}">{{ s.store_name }}</option>
            {% endfor %}
        </select>

        <label>Category</label>
        <select name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.category_id }}">{{ c.name }}</option>
            {% endfor %}
        </select>

        <label>Product Name</label>
        <input type="text" name="name" required>

        <label>Description</label>
        <textarea name="description" rows="3"></textarea>

        <label>Price ($)</label>
        <input type="number" step="0.01" name="price" required>

        <label>Stock Quantity</label>
        <input type="number" name="stock_quantity" required>

        <button type="submit">Add Product</button>
    </form>
</body>
</html>
