<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 500px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 12px 20px; background: #ff9900; border: none; font-weight: bold; cursor: pointer; }
        .back { margin-bottom: 15px; display: inline-block; color: #0066c0; }
        .success { background: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <a class="back" href="/products">&larr; Back to Products</a>
    <h1>Edit Product</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
        <label>Seller</label>
        <select name="seller_id" required>
            {% for s in sellers %}
            <option value="{{ s.seller_id }}" {% if s.seller_id == product.seller_id %}selected{% endif %}>{{ s.store_name }}</option>
            {% endfor %}
        </select>

        <label>Category</label>
        <select name="category_id" required>
            {% for c in categories %}
            <option value="{{ c.category_id }}" {% if c.category_id == product.category_id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>

        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>

        <label>Description</label>
        <textarea name="description" rows="3">{{ product.description or '' }}</textarea>

        <label>Price ($)</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required>

        <label>Stock Quantity</label>
        <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" required>

        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
