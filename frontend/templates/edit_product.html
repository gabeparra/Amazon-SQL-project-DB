{% extends "base.html" %}
{% block title %}Edit Product · Amazon DB{% endblock %}
{% block page_title %}Edit Product{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Edit Product #{{ product.product_id }}</h1>
    <a href="/products" class="btn btn-secondary">← Back to Products</a>
</div>

<div class="card" style="max-width:620px;">
    <div class="card-body">
        <form method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>Seller</label>
                    <select name="seller_id" required>
                        {% for s in sellers %}
                        <option value="{{ s.seller_id }}" {{ 'selected' if s.seller_id == product.seller_id }}>{{ s.store_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select name="category_id" required>
                        {% for c in categories %}
                        <option value="{{ c.category_id }}" {{ 'selected' if c.category_id == product.category_id }}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group span2">
                    <label>Product Name</label>
                    <input type="text" name="name" required value="{{ product.name }}">
                </div>
                <div class="form-group span2">
                    <label>Description</label>
                    <textarea name="description">{{ product.description or '' }}</textarea>
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" step="0.01" name="price" required min="0" value="{{ product.price }}">
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" name="stock_quantity" required min="0" value="{{ product.stock_quantity }}">
                </div>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/products" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
