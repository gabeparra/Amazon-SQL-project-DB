{% extends "base.html" %}
{% block title %}Edit Seller · Amazon DB{% endblock %}
{% block page_title %}Edit Seller{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Edit Seller #{{ seller.seller_id }}</h1>
    <a href="/sellers" class="btn btn-secondary">← Back to Sellers</a>
</div>

<div class="card" style="max-width:480px;">
    <div class="card-body">
        <form method="post">
            <div class="form-grid full">
                <div class="form-group">
                    <label>Store Name</label>
                    <input type="text" name="store_name" required value="{{ seller.store_name }}">
                </div>
                <div class="form-group">
                    <label>Rating (0.0 – 5.0)</label>
                    <input type="number" name="rating" min="0" max="5" step="0.1" required value="{{ seller.rating }}">
                </div>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/sellers" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
