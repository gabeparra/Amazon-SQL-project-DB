{% extends "base.html" %}
{% block title %}Add Customer · Amazon DB{% endblock %}
{% block page_title %}Add Customer{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Add New Customer</h1>
    <a href="/customers" class="btn btn-secondary">← Back to Customers</a>
</div>

<div class="card" style="max-width:560px;">
    <div class="card-body">
        <form method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" required placeholder="Alice">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" required placeholder="Johnson">
                </div>
                <div class="form-group span2">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="alice@example.com">
                </div>
                <div class="form-group span2">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="555-0101">
                </div>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">Add Customer</button>
                <a href="/customers" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
